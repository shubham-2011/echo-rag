version: '3.8'

services:
  ecorag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecorag-backend:latest
    container_name: ecorag-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ECORAG_API_KEY=${ECORAG_API_KEY:-}
      - ECORAG_API_KEYS_JSON=${ECORAG_API_KEYS_JSON:-}
      - ECORAG_API_SCOPES=${ECORAG_API_SCOPES:-read,write}
      - SECURITY_AUTH_REQUESTS_PER_WINDOW=${SECURITY_AUTH_REQUESTS_PER_WINDOW:-30}
      - SECURITY_MAX_QUERY_CHARS=${SECURITY_MAX_QUERY_CHARS:-20000}
      - SECURITY_MAX_DOCUMENT_CHARS=${SECURITY_MAX_DOCUMENT_CHARS:-5000000}
      - SECURITY_MAX_UPLOAD_BYTES=${SECURITY_MAX_UPLOAD_BYTES:-26214400}
      - SECURITY_MAX_REQUEST_BYTES=${SECURITY_MAX_REQUEST_BYTES:-33554432}
      - SECURITY_MAX_FILENAME_CHARS=${SECURITY_MAX_FILENAME_CHARS:-255}
      - SECURITY_MAX_DOC_ID_CHARS=${SECURITY_MAX_DOC_ID_CHARS:-200}
      - SECURITY_MIN_CHUNK_SIZE=${SECURITY_MIN_CHUNK_SIZE:-10}
      - SECURITY_MAX_CHUNK_SIZE=${SECURITY_MAX_CHUNK_SIZE:-4096}
      - SECURITY_MAX_CHUNK_OVERLAP=${SECURITY_MAX_CHUNK_OVERLAP:-2048}
      - SECURITY_PARSE_TIMEOUT_SECONDS=${SECURITY_PARSE_TIMEOUT_SECONDS:-15}
      - SECURITY_MODEL_TIMEOUT_SECONDS=${SECURITY_MODEL_TIMEOUT_SECONDS:-30}
      - SECURITY_RATE_LIMIT_WINDOW_SECONDS=${SECURITY_RATE_LIMIT_WINDOW_SECONDS:-60}
      - SECURITY_QUERY_REQUESTS_PER_WINDOW=${SECURITY_QUERY_REQUESTS_PER_WINDOW:-30}
      - SECURITY_SEARCH_REQUESTS_PER_WINDOW=${SECURITY_SEARCH_REQUESTS_PER_WINDOW:-60}
      - SECURITY_INGESTION_REQUESTS_PER_WINDOW=${SECURITY_INGESTION_REQUESTS_PER_WINDOW:-10}
      - SECURITY_MAX_CONCURRENT_QUERIES=${SECURITY_MAX_CONCURRENT_QUERIES:-4}
      - SECURITY_MAX_CONCURRENT_SEARCHES=${SECURITY_MAX_CONCURRENT_SEARCHES:-8}
      - SECURITY_MAX_CONCURRENT_INGESTIONS=${SECURITY_MAX_CONCURRENT_INGESTIONS:-2}
      - SECURITY_MAX_CONCURRENT_PARSES=${SECURITY_MAX_CONCURRENT_PARSES:-2}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8501,http://127.0.0.1:8501
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
