[pytest]
markers =
    unit: Canonicalization, hashing, Merkle (no network, no chain).
    blockchain: Smart contract or chain adapter (may skip without local EVM).
    integration: Audit pipeline across service, DB, and API.
    security: Key leakage and injection guards.
    performance: Latency and batch load (optional, slow).
    regression: RAG behavior unchanged when audit is enabled.
    e2e: Full experiment anchor and verify flows.

testpaths = tests
